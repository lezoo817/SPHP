[project]
name = "sphp-agent"
version = "2.0.0"
description = "智愈先锋 AI Agent 服务"
requires-python = ">=3.11"
dependencies = [
    # AI 编排
    "langchain>=1.3",
    "langchain-openai>=1.4",
    "langgraph>=1.0",
    "langchain-community>=0.3",

    # MCP 协议
    "mcp>=1.0",

    # 知识库 RAG
    "langchain-postgres>=0.0.14",
    "langchain-text-splitters>=0.3",
    "psycopg[binary]>=3.2",
    "cryptography>=42.0",

    # Web 服务
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",

    # 配置与校验
    "pydantic>=2.13",
    "pydantic-settings>=2.14",

    # HTTP
    "httpx>=0.27",

    # 缓存
    "redis[hiredis]>=5.0",

    # 可观测性
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.8",
]
prod = [
    "prometheus-client>=0.19",
    "PyJWT>=2.8",
    "langgraph-checkpoint-postgres>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# MCP 工具封装为声明式 Schema，description 较长以利于 LLM 理解，放宽行长
"app/mcp_server/tools/*.py" = ["E501"]

[tool.pytest.ini_options]
# 集成测试标记（依赖外部服务如 Redis/PG，可单独跳过）
markers = [
    "integration: 依赖真实外部服务（Redis/PG），本地就绪时运行",
]

[tool.mypy]
python_version = "3.13"
strict = true
