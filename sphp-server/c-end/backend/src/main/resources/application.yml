server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: sphp-patient-backend

  # ---- MySQL ----
  datasource:
    url: jdbc:mysql://localhost:3306/sphp?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Redis ----
  data:
    redis:
      host: localhost
      port: 6379

  # ---- RabbitMQ ----
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---- JWT ----
sphp:
  jwt:
    secret: sphp-patient-jwt-secret-change-in-production
    expiration: 7200  # 单位：秒（2小时）

  # ---- 号源预扣超时 ----
  registration:
    payment-timeout: 900  # 支付超时 15 分钟（秒）
