server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: sphp-bootstrap

  # ---- PostgreSQL ----
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    username: postgres
    password: postgres
    url: jdbc:postgresql://118.25.102.33:5432/sphp?client_encoding=UTF8
    hikari:
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 5
      pool-name: SphpHikariPool

  # ---- Redis ----
  data:
    redis:
      host: 118.25.102.33
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # ---- RabbitMQ ----
  rabbitmq:
    host: 118.25.102.33
    port: 5672
    username: admin
    password: 123456
    virtual-host: /
    connection-timeout: 1000ms
    dynamic: true
    listener:
      simple:
        auto-startup: true
        acknowledge-mode: auto
        concurrency: 5
        max-concurrency: 10
      direct:
        auto-startup: true

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: "null"


sphp:
  cors:
    # 允许访问统一后端的本地前端来源。
    allowed-origins:
      - http://localhost:8000
      - http://localhost:8001

  jwt:
    # C 端患者 Token 签名密钥。
    patient:
      secret: sphp-patient-jwt-secret-change-in-production
      expiration: 7200
    # B 端医生和管理员 Token 签名密钥。
    admin:
      secret: sphp-admin-jwt-secret-change-in-production
      expiration: 7200

  # ---- 号源预扣超时 ----
  registration:
    payment-timeout: 300
