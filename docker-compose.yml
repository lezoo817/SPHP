# 智愈先锋 - 开发环境中间件
# 使用方法：docker compose up -d
# 停止：docker compose down
# 清数据：docker compose down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sphp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sphp
      POSTGRES_PASSWORD: sphp123
      POSTGRES_DB: sphp
      TZ: Asia/Shanghai
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d  # 自动执行 sql/ 下的 .sql 文件
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sphp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sphp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sphp-rabbitmq
    ports:
      - "5672:5672"     # AMQP 端口
      - "15672:15672"   # 管理界面（guest/guest）
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  pg-data:
  redis-data:
  rabbitmq-data:
